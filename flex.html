<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .container{
            display:flex;
            width: 500px;
           min-height: 500px;
            border-radius: 15px;
            background-color: blue;
            gap: 20px;
            margin: auto;
            justify-content: space-around;
            flex-wrap: wrap;
            display: flex;
            
            /* an element u add flex 1 to will take even space 
            Justify content to move the  main divs in the flex to the right 
            flex-direction colum to arrange the divs vertically and rows horizontally
            align item center to align the div in a vertical direcrion while still being aranged horizontally 
            */
        }
        div{ background-color: rgb(0, 191, 255);

            color: azure;
            width: 100px;
            height: 80px;
            text-align: center;


        }
    </style>
</head>
<body>
    <div class="container">

        <div> apple</div>
        <div> mango</div>
        <div> cherry</div>
        <div> banana</div>
        <div> orange</div>
        <div> lemon </div>
        <div> pineapple</div>
    </div>
    
</body>
</html>
