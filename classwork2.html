     header{

     }

        color: aliceblue;
        font-size: 2rem;
     }
     nav {
        color: aliceblue;
        gap: 20px;
        justify-content: center;
        display: flex;

     }
     nav a {
        color: aliceblue;
        text-decoration: none;
     }
     .container{
        display: flex;
        gap: 20px;
     }
     .container h2{
      color: black;
      margin-top: auto;
      text-align:left ;
     }

   aside{ background-color: aliceblue;
    width: 220px;

      box-shadow: 8px 10px 50px;
      border-radius: 0 10px 10px;
} 

 .vertical-nav a{
    color: rgb(176, 41, 41);

    border: 1px solid rgb(239, 239, 240);
    display: flex;
    flex-direction:column;
     border-radius: 4px;
     text-decoration: none;
     padding: 8px;
     
 }


       
 .card{
            border: 1px solid rgba(215, 222, 215, 0);
            align-items: center;
            width:165;
            flex-direction: column;
            min-height: 200px;
           border-radius: 8px; 
            text-align: center;
            display: flex;
            background-color: aquamarine;
            padding: 12px;
            align-items: center;
            text-align: center;
            

        }
        .card img{
         width: 110px;
         height: 110px;
         border-radius: 50%;
         object-fit: cover;
        }
        main h2{
         color: black;
         margin: 0 0 20px 0;
        }
         main{
            flex: 1;
            padding: 20px;

         }
         .card h3{ margin: 14px 0 8px 0;

         }
        


    </style>
</head>
