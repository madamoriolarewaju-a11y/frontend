<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        


        body{
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color:blueviolet;
    
        }
        

        .logincard {
            background-color:rgb(241, 241, 241);
            width: 340px;
            padding: 35px 30px;
            border-radius: 14px;
            border: 1px solid rgb(0, 0, 0);
        }
        .logincard h1 {
            margin: 0 0 8px 0;
            color: #1d1b1b;
        }
        .logincard p{
            margin: 0 0 25px 0;
            color: #777;
        }
        label{
            display: block;
            color: #444;
            margin-bottom:6px;
            font-weight: bold;
        }
        input{
            width: 100%;
            padding: 11px 12px;
            border: 1px solid azure;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .signup{
            text-align: center;
            text-decoration: none;
            color: rgb(8, 9, 9);
            margin-top: 20px;
        }
        .signup a{
            text-decoration: none;
            color: #1d1b1b;
        }
        button{
            width: 100%;
            background-color: green;
            color: beige;
            border-radius: 6px;
        }

    </style>
</head>
<body>
    <div class="logincard">
        <h1>Create Account</h1>
        <p>Join Account Hub</p>




        <form > 
            <label for="name"> Full name</label>
            <input type=" full name " placeholder=" John Doe">
            <label for="password">Password</label>
            <input type="password" placeholder="Password">
            <button type="submit"> Log in</button>
        </form>
    <div class="signup">
        Already have an account
        <a href="#">Log in</a>
    </div>
    </div>
    
</body>
</html>
