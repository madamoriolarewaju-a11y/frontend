<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        table{border: 1px solid blue;width: 100%;
        border-collapse: collapse;}
        th, td{border: 1px solid blue;
        text-align: center;}
        tr:hover{background-color: rgb(17, 192, 128);color: aliceblue; }
        tr:nth-child(2n+1){
            background-color: aqua;
            color: rgb(199, 33, 7);
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1>Tables in html</h1>
<p> table tag is used to define table in html</p>
<p> tr is used to define table row</p>
<p>td is used to define table data</p>
<table>
    <tr>


    <th>Name</th>
    <th>Age</th>
    <th>City</th>
<tr>
    <td>fola</td>
    <td>19</td>
    <td>ibadan</td>
</tr>

    </tr>
</tr>

</body>
</html>
