<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            border-radius: 15px;
            border: 1px solid rgb(215, 26, 26);
            display: flex;
            flex-direction: column;
            margin: auto;
            width: 300px;
            min-height: 300px;
            align-items: center;
        }
        img{ 
            width: 100px;
            height: 100px;
             border-radius: 50%;
             
        }
        
        button{
            width: 100px;
            height:  40px;
            padding: 5px;
            border-radius: 8px;
            cursor: pointer;
        
        background-color: blue;
         color: aliceblue;}
        p{ text-align: center;}

        button:hover{
            background-color: blueviolet;
            color: aliceblue;
            transform: scale(1.1);
        }


    </style>
</head>
<body>
    <div class="card">                                                                                                                                                                                                                                                                                                                                                                                                                         
        <img src="pic.jpg" alt="profile picture">
        <h2> JOHN DOE</h2>
        <p>Web Developer who loves html and css and teaching beginners</p>
        <button>follow us</button>
    </div>
</body>
</html>
